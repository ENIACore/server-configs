name: Bug report
description: Report a problem with a setup script or configuration
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the
        details below. **Do not include real domains, IP addresses,
        credentials, or API keys** — redact them before submitting.

  - type: input
    id: component
    attributes:
      label: Affected script/component
      description: Which file or service is affected? (e.g. `nginx/nginx-setup.py`, `f2b/f2b-reload.py`)
      placeholder: path/to/file.py
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run `install.py`
        2. Select service X
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs/output
      description: Paste relevant logs or terminal output. Redact secrets/domains/IPs.
      render: shell

  - type: input
    id: os
    attributes:
      label: OS / distro version
      placeholder: e.g. Ubuntu Server 24.04 LTS
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have removed any secrets, domains, or IP addresses from this report
          required: true
        - label: I have searched existing issues and this is not a duplicate
          required: true
